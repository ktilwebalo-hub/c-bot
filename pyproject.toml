[project]
name = "c-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ktilwebalo-hub", email = "ktilwebalo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "openai>=3.5.0",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
c-bot = "c_bot:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
